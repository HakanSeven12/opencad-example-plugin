name: release

# Build the plugin cdylib for each desktop platform and attach the binaries
# (plus plugin.toml) to a GitHub Release when a v* tag is pushed. Open CAD
# Studio's Plugin Manager reads the release assets, picks the one matching the
# user's OS/arch, and installs it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ext: so
            asset: opencad.example-linux-x86_64.so
          - os: windows-latest
            ext: dll
            asset: opencad.example-windows-x86_64.dll
          - os: macos-latest
            ext: dylib
            asset: opencad.example-macos-aarch64.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p dist
          # The cdylib name varies by platform (lib*.so / *.dll / lib*.dylib);
          # the host loader accepts any name with the right extension.
          cp target/release/*.${{ matrix.ext }} "dist/${{ matrix.asset }}"
          # API 4+ hosts load a plugin only when it was built by the same
          # rustc against the same opencadcodec commit as the host. Record
          # both in the shipped manifest.
          python3 - "$(rustc --version)" <<'PY'
          import re, sys
          from pathlib import Path
          lock = Path("Cargo.lock").read_text()
          sources = re.findall(r'name = "opencadcodec"\nversion = "[^"]+"\nsource = "([^"]+)"', lock)
          if len(sources) != 1:
              raise SystemExit(f"expected one opencadcodec source in Cargo.lock, found {len(sources)}")
          manifest = Path("plugin.toml").read_text()
          manifest = manifest.replace("__RUSTC_VERSION__", sys.argv[1])
          manifest = manifest.replace("__ACADRUST_SOURCE__", sources[0])
          if "__" in manifest:
              raise SystemExit("unresolved plugin.toml placeholder")
          Path("dist/plugin.toml").write_text(manifest)
          PY
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.asset }}
            dist/plugin.toml
